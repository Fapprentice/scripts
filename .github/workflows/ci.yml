name: Task Verge CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  syntax-and-unit:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install unit-test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check syntax and lint
        run: |
          Get-ChildItem task-panel.pyw,*.py,tests -Recurse -File |
            Where-Object { $_.FullName -notmatch '\\(__pycache__|\.pytest_cache)\\' } |
            ForEach-Object { python -m py_compile $_.FullName }
          node --check web/app.js
          python -m ruff check --select E9,F63,F7,F82 --output-format=github .
      - name: Run deterministic regression gate
        run: |
          python evaluation.py --run
          python evaluation.py --calibrate evals/calibration.json
      - name: Run deterministic tests
        run: >-
          python -m pytest tests/ -x -v --timeout=60
          --ignore=tests/test_api.py
          --ignore=tests/test_e2e_main_flow.py
          --ignore=tests/test_ui_full_flow.py

  release-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    needs: syntax-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packaging dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build unsigned portable release
        shell: powershell
        run: .\packaging\build.ps1 -ZipOnly -SkipTests
      - name: Verify portable release outputs
        shell: powershell
        run: |
          if (-not (Test-Path dist\TaskVerge\TaskVerge.exe)) { throw "TaskVerge.exe was not built" }
          $version = (Get-Content VERSION -Raw).Trim()
          if (-not (Test-Path "task-verge-portable-v$version-win-x64.zip")) { throw "Portable ZIP was not built" }
          if (-not (Test-Path dist\TaskVerge\_internal\packs\python-intro\v2.json)) { throw "Skill Pack data missing from release" }
          $smokeData = Join-Path $env:RUNNER_TEMP ("taskverge-release-smoke-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $smokeData | Out-Null
          $env:LOCALAPPDATA = $smokeData
          & .\dist\TaskVerge\TaskVerge.exe --pack-smoke
          if ($LASTEXITCODE -ne 0) { throw "Packaged skill planning smoke failed" }

  e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    needs: syntax-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser-test dependencies
        run: python -m pip install -r requirements-e2e.txt
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Start Task Verge and publish its discovered URL
        shell: pwsh
        run: |
          $dataDir = Join-Path $env:RUNNER_TEMP ("taskverge-ci-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $dataDir | Out-Null
          $env:LOCALAPPDATA = $dataDir
          $env:TASKVERGE_PORT = "0"
          $stdout = Join-Path $dataDir "server.out"
          $stderr = Join-Path $dataDir "server.err"
          $server = Start-Process python -ArgumentList @("task-panel.pyw", "--ci") -WorkingDirectory $env:GITHUB_WORKSPACE -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          "TASKVERGE_CI_PID=$($server.Id)" | Add-Content $env:GITHUB_ENV
          "TASKVERGE_CI_DATA_DIR=$dataDir" | Add-Content $env:GITHUB_ENV
          $urlFile = Join-Path $dataDir "TaskVerge\task-panel.url"
          for ($i = 0; $i -lt 100; $i++) {
            if (Test-Path $urlFile) {
              $url = (Get-Content $urlFile -Raw).Trim()
              try { Invoke-WebRequest -Uri ($url + "api/heartbeat") -UseBasicParsing -TimeoutSec 2 | Out-Null; break } catch {}
            }
            Start-Sleep -Milliseconds 100
          }
          if (-not $url) { Get-Content $stderr -ErrorAction SilentlyContinue; throw "CI server did not publish a URL" }
          "TASKVERGE_TEST_URL=$url" | Add-Content $env:GITHUB_ENV
      - name: Run API integration tests
        run: python -m pytest tests/test_api.py -v --timeout=60
      - name: Stop API instance
        if: always()
        shell: pwsh
        run: Stop-Process -Id $env:TASKVERGE_CI_PID -Force -ErrorAction SilentlyContinue
      - name: Start fresh Task Verge for save-pending browser regression
        shell: pwsh
        run: |
          $pendingDataDir = Join-Path $env:TASKVERGE_CI_DATA_DIR "save-pending-data"
          New-Item -ItemType Directory -Path $pendingDataDir | Out-Null
          $env:LOCALAPPDATA = $pendingDataDir
          $env:TASKVERGE_PORT = "0"
          $stdout = Join-Path $env:TASKVERGE_CI_DATA_DIR "save-pending-server.out"
          $server = Start-Process python -ArgumentList @("task-panel.pyw", "--ci") -WorkingDirectory $env:GITHUB_WORKSPACE -RedirectStandardOutput $stdout -RedirectStandardError (Join-Path $env:TASKVERGE_CI_DATA_DIR "save-pending-server.err") -PassThru
          "TASKVERGE_CI_PID=$($server.Id)" | Add-Content $env:GITHUB_ENV
          $urlFile = Join-Path $pendingDataDir "TaskVerge\task-panel.url"
          for ($i = 0; $i -lt 100; $i++) {
            if (Test-Path $urlFile) { $url = (Get-Content $urlFile -Raw).Trim(); break }
            Start-Sleep -Milliseconds 100
          }
          if (-not $url) { throw "Save-pending browser server did not publish a URL" }
          "TASKVERGE_TEST_URL=$url" | Add-Content $env:GITHUB_ENV
      - name: Run save-pending browser regression
        run: python -m pytest tests/test_ui_evidence_save_pending.py -v --timeout=180
      - name: Stop save-pending browser instance
        if: always()
        shell: pwsh
        run: Stop-Process -Id $env:TASKVERGE_CI_PID -Force -ErrorAction SilentlyContinue
      - name: Start fresh Task Verge for start-pending browser regression
        shell: pwsh
        run: |
          $startDataDir = Join-Path $env:TASKVERGE_CI_DATA_DIR "start-pending-data"
          New-Item -ItemType Directory -Path $startDataDir | Out-Null
          $env:LOCALAPPDATA = $startDataDir
          $env:TASKVERGE_PORT = "0"
          $stdout = Join-Path $env:TASKVERGE_CI_DATA_DIR "start-pending-server.out"
          $server = Start-Process python -ArgumentList @("task-panel.pyw", "--ci") -WorkingDirectory $env:GITHUB_WORKSPACE -RedirectStandardOutput $stdout -RedirectStandardError (Join-Path $env:TASKVERGE_CI_DATA_DIR "start-pending-server.err") -PassThru
          "TASKVERGE_CI_PID=$($server.Id)" | Add-Content $env:GITHUB_ENV
          $urlFile = Join-Path $startDataDir "TaskVerge\task-panel.url"
          for ($i = 0; $i -lt 100; $i++) {
            if (Test-Path $urlFile) { $url = (Get-Content $urlFile -Raw).Trim(); break }
            Start-Sleep -Milliseconds 100
          }
          if (-not $url) { throw "Start-pending browser server did not publish a URL" }
          "TASKVERGE_TEST_URL=$url" | Add-Content $env:GITHUB_ENV
      - name: Run start-pending browser regression
        run: python -m pytest tests/test_ui_start_pending.py -v --timeout=180
      - name: Stop start-pending browser instance
        if: always()
        shell: pwsh
        run: Stop-Process -Id $env:TASKVERGE_CI_PID -Force -ErrorAction SilentlyContinue
      - name: Start fresh Task Verge for browser E2E
        shell: pwsh
        run: |
          $browserDataDir = Join-Path $env:TASKVERGE_CI_DATA_DIR "browser-data"
          New-Item -ItemType Directory -Path $browserDataDir | Out-Null
          $env:LOCALAPPDATA = $browserDataDir
          $env:TASKVERGE_PORT = "0"
          $stdout = Join-Path $env:TASKVERGE_CI_DATA_DIR "browser-server.out"
          $server = Start-Process python -ArgumentList @("task-panel.pyw", "--ci") -WorkingDirectory $env:GITHUB_WORKSPACE -RedirectStandardOutput $stdout -RedirectStandardError (Join-Path $env:TASKVERGE_CI_DATA_DIR "browser-server.err") -PassThru
          "TASKVERGE_CI_PID=$($server.Id)" | Add-Content $env:GITHUB_ENV
          $urlFile = Join-Path $browserDataDir "TaskVerge\task-panel.url"
          for ($i = 0; $i -lt 100; $i++) {
            if (Test-Path $urlFile) { $url = (Get-Content $urlFile -Raw).Trim(); break }
            Start-Sleep -Milliseconds 100
          }
          if (-not $url) { throw "Browser CI server did not publish a URL" }
          "TASKVERGE_TEST_URL=$url" | Add-Content $env:GITHUB_ENV
      - name: Run browser E2E tests
        run: >-
          python -m pytest tests/test_ui_evidence_roundtrip.py tests/test_e2e_main_flow.py tests/test_e2e_regressions.py tests/test_ui_full_flow.py
          -v --timeout=180
      - name: Upload E2E diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            tests/screenshots/
            ${{ env.TASKVERGE_CI_DATA_DIR }}/*.err
            ${{ env.TASKVERGE_CI_DATA_DIR }}/*.out
          if-no-files-found: ignore
      - name: Stop browser instance
        if: always()
        shell: pwsh
        run: Stop-Process -Id $env:TASKVERGE_CI_PID -Force -ErrorAction SilentlyContinue
